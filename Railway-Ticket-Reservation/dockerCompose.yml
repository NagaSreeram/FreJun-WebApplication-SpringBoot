FROM openjdk:17-jdk-slim

WORKDIR /app

COPY target/railway-reservation-0.0.1-SNAPSHOT.jar app.jar

EXPOSE 1369

ENTRYPOINT ["java", "-jar", "app.jar"]

---

version: '3.8'

services:
  app:
    build: .
    ports:
      - "1369:1369"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/railway-reservation
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: railway-reservation
    ports:
      - "3306:3306"
